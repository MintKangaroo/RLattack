[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rlattack"
version = "0.1.0"
description = "Reinforcement-learning research for simulated attack-path exploration."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AI Security Lab Contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "gymnasium>=1.0,<2",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
training = [
  "stable-baselines3>=2.4,<3",
  "tensorboard>=2.16,<3",
  "torch>=2.2,<3",
]
dashboard = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "types-networkx>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rlattack"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=rlattack --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
